<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Connect Point</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7f5af0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <!-- Custom CSS (external) -->
  <link rel="stylesheet" href="src/styles.css" />

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"
      }
    }
  </script>

  <!-- CRITICAL FIX: Inline styles to force visibility of auth screen -->
  <style>
    /* Ensure background and card are always visible */
    body {
      background: #08090d !important;
      color: #eaeaf0;
      font-family: 'Inter', sans-serif;
    }

    /* Animated gradient fallback */
    body::before {
      content: "";
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, #7f5af0 0%, #ff6b6b 25%, #4ecdc4 50%, #9b7eff 75%, #ff6b6b 100%);
      background-size: 400% 400%;
      animation: gradientMove 20s ease infinite;
      opacity: 0.1;
      z-index: -1;
      pointer-events: none;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass card must be opaque enough */
    .glass {
      background: rgba(255, 255, 255, 0.12) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    /* Auth card container center */
    .container-center {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Quick fixes for auth elements */
    .auth-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; color: white; }
    .auth-subtitle { color: #aaa; font-size: 0.95rem; }
    .input-field { background: rgba(255,255,255,0.1) !important; border: 1px solid rgba(255,255,255,0.2) !important; color: white !important; }
    .input-field::placeholder { color: #888 !important; }
    .btn-primary { background: #7f5af0 !important; color: white !important; }
    .btn-google { background: white !important; color: #1a1a2e !important; }
    .btn-github { background: #24292e !important; color: white !important; }
    .error-msg { background: rgba(239,68,68,0.15); color: #ef4444; padding: 8px; border-radius: 8px; margin-bottom: 12px; }
    .success-msg { background: rgba(34,197,94,0.15); color: #22c55e; padding: 8px; border-radius: 8px; margin-bottom: 12px; }
    .password-toggle { color: #aaa; }
    .divider span { color: #aaa; }
    .auth-switch, .auth-switch a { color: #aaa; }
    .link-btn { color: #9b7eff; text-decoration: underline; background: none; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Global error handler -->
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('root').innerHTML = 
        '<div style="padding:20px; color:white; background:#1a1a2e; min-height:100vh;">' +
        '<h2>Error</h2>' +
        '<p><b>Message:</b> ' + msg + '</p>' +
        '<p><b>File:</b> ' + url + '</p>' +
        '<p><b>Line:</b> ' + line + '</p>' +
        '</div>';
    };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Main app -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
