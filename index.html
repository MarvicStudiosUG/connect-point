<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Connect Point</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7f5af0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="src/styles.css" />

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Install button (always visible after SW ready) -->
  <div id="install-button-container" style="display:none; position:fixed; top:10px; right:10px; z-index:200;">
    <button id="install-btn" class="btn btn-primary" style="padding:10px 16px; font-size:0.9rem; border-radius:20px;">
      <i class="ph ph-download-simple"></i> Install
    </button>
  </div>

  <!-- Global error handler -->
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('root').innerHTML = 
        '<div style="padding:20px; color:white; background:#1a1a2e; min-height:100vh;">' +
        '<h2>Error</h2>' +
        '<p><b>Message:</b> ' + msg + '</p>' +
        '<p><b>File:</b> ' + url + '</p>' +
        '<p><b>Line:</b> ' + line + '</p>' +
        '</div>';
    };
  </script>

  <!-- Service Worker + Install logic -->
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const installContainer = document.getElementById('install-button-container');

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => {
            console.log('SW registered');
            // Show install button after SW is active
            installContainer.style.display = 'block';
          })
          .catch((err) => {
            console.warn('SW registration failed, but install may still work', err);
            installContainer.style.display = 'block'; // show anyway
          });
      });
    }

    // Capture the native install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // Install button click
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install outcome:', outcome);
        deferredPrompt = null;
        installContainer.style.display = 'none';
      } else {
        // Fallback: show instruction
        alert('To install the app, tap the browser menu (three dots) and select "Add to Home screen" or "Install".');
      }
    });

    // Hide button after installation
    window.addEventListener('appinstalled', () => {
      installContainer.style.display = 'none';
    });
  </script>

  <!-- Main app -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
