<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Connect Point</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#7f5af0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="src/styles.css" />

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Global error handler (for debugging) -->
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('root').innerHTML = 
        '<div style="padding:20px; color:white; background:#1a1a2e; min-height:100vh;">' +
        '<h2>Error</h2>' +
        '<p><b>Message:</b> ' + msg + '</p>' +
        '<p><b>File:</b> ' + url + '</p>' +
        '<p><b>Line:</b> ' + line + '</p>' +
        '</div>';
    };
  </script>

  <!-- Install button container (will be shown by our JS) -->
  <div id="install-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; background: var(--surface); backdrop-filter: blur(20px); padding:16px; border-top:1px solid var(--border); z-index:200; text-align:center;">
    <button id="install-btn" class="btn btn-primary" style="width:100%">Install App</button>
  </div>

  <!-- Service Worker registration + install prompt logic -->
  <script>
    let deferredPrompt;

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('SW registered'))
          .catch((err) => console.log('SW registration failed', err));
      });
    }

    // Listen for the install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'block';
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('Install outcome:', outcome);
      deferredPrompt = null;
      document.getElementById('install-banner').style.display = 'none';
    });

    // Hide banner after install
    window.addEventListener('appinstalled', () => {
      document.getElementById('install-banner').style.display = 'none';
    });
  </script>

  <!-- Main app -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
